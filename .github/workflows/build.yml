name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q plank-coach.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: plank
        run: |
          npm install
          npm test
          node scripts/copy-mediapipe.mjs
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PlankCoach-apk
          path: plank/android/app/build/outputs/apk/debug/app-debug.apk
